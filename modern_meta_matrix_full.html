<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a tournament judge's scoresheet. Cool paper ground,
   ink type, results carried by a red-to-green heat scale; violet ink is
   the one accent and never encodes a result. */
:root {
  --paper: #f3f4f1;          /* page ground */
  --sheet: #fbfbf9;          /* raised surfaces (tables, drawer) */
  --rule: #d9dcd5;           /* hairlines */
  --ink: #17191d;            /* primary text */
  --ink-2: #4a4f57;          /* secondary text */
  --ink-3: #7b818a;          /* captions */
  --accent: #5b3fd6;         /* violet ink: links, selection, focus */
  --accent-soft: #ebe7fb;
  --lose: #c2402f;           /* semantic: below band / losing */
  --win: #1f7a4d;            /* semantic: above band / winning */
  --even: #e9e6d8;           /* 50% on the heat scale */
  --warn: #b7791f;           /* draws / aborts markers */
  --heat-lo: 9 62% 52%;      /* hsl parts: 0% end of the heat scale */
  --heat-mid: 48 20% 88%;    /* 50% */
  --heat-hi: 152 52% 36%;    /* 100% end */
  --heat-ink-dark: #17191d;
  --heat-ink-light: #ffffff;
  --shadow: 0 1px 2px rgb(23 25 29 / .06), 0 8px 24px rgb(23 25 29 / .08);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: .75rem; --s-2: .875rem; --s-3: 1rem; --s-4: 1.25rem; --s-5: 1.75rem; --s-6: 2.5rem; --s-7: 3.75rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121417; --sheet: #191c20; --rule: #2b3037;
    --ink: #e9eaec; --ink-2: #b4b9c1; --ink-3: #868c96;
    --accent: #a593ff; --accent-soft: #2a2450;
    --lose: #f0715f; --win: #4cc28a; --even: #34332c; --warn: #e0a645;
    --heat-lo: 8 55% 40%; --heat-mid: 48 10% 24%; --heat-hi: 152 45% 34%;
    --heat-ink-dark: #e9eaec; --heat-ink-light: #ffffff;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121417; --sheet: #191c20; --rule: #2b3037;
  --ink: #e9eaec; --ink-2: #b4b9c1; --ink-3: #868c96;
  --accent: #a593ff; --accent-soft: #2a2450;
  --lose: #f0715f; --win: #4cc28a; --even: #34332c; --warn: #e0a645;
  --heat-lo: 8 55% 40%; --heat-mid: 48 10% 24%; --heat-hi: 152 45% 34%;
  --heat-ink-dark: #e9eaec; --heat-ink-light: #ffffff;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s-2)/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
.num, .mono { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.label { font-size: var(--s-1); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: .3em; padding: .1em .55em; border-radius: 99px; font-size: var(--s-1); font-weight: 600; border: 1px solid var(--rule); color: var(--ink-2); background: var(--sheet); white-space: nowrap; }
.verdict-in { color: var(--win); border-color: color-mix(in srgb, var(--win) 40%, transparent); }
.verdict-below, .verdict-above { color: var(--lose); border-color: color-mix(in srgb, var(--lose) 40%, transparent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap > * { min-width: 0; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: var(--s-5) var(--s-7); display: grid; gap: var(--s-5); }
header.top { display: grid; gap: var(--s-2); }
header.top h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem); }
.lede { color: var(--ink-2); max-width: 68ch; margin: 0; }
.prov { display: flex; flex-wrap: wrap; gap: .4rem; }
.prov .chip b { color: var(--ink); font-family: var(--f-data); font-weight: 500; }
.bar { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: end; padding: var(--s-3); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.ctl { display: grid; gap: .25rem; }
.ctl select, .ctl input[type=search] { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: .35rem .5rem; min-width: 10rem; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { font: 600 var(--s-1)/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; padding: .5rem .7rem; border: 0; background: var(--paper); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.legend { display: flex; align-items: center; gap: .5rem; margin-left: auto; font-size: var(--s-1); color: var(--ink-3); flex-wrap: wrap; }
.scale { width: 140px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, hsl(var(--heat-lo)), hsl(var(--heat-mid)), hsl(var(--heat-hi))); }
.mk { display: inline-block; width: 8px; height: 8px; }
.mk.draw { border-radius: 50%; background: var(--warn); }
.mk.band { border: 2px solid var(--ink); border-radius: 1px; width: 10px; height: 10px; }

/* Standings */
.standings { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); overflow-x: auto; }
table.st { width: 100%; border-collapse: collapse; min-width: 720px; }
table.st th, table.st td { padding: .5rem .7rem; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.st th { font: 600 var(--s-1)/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
table.st td.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
table.st tr { cursor: pointer; }
table.st tbody tr:hover { background: var(--accent-soft); }
table.st tr.sel { background: var(--accent-soft); }
.deckname { font-weight: 600; }
.arch { color: var(--ink-3); font-size: var(--s-1); text-transform: capitalize; }
.bandbar { position: relative; width: 160px; height: 14px; background: linear-gradient(90deg, transparent calc(var(--lo) * 1%), color-mix(in srgb, var(--win) 22%, transparent) calc(var(--lo) * 1%), color-mix(in srgb, var(--win) 22%, transparent) calc(var(--hi) * 1%), transparent calc(var(--hi) * 1%)), var(--paper); border: 1px solid var(--rule); border-radius: 2px; }
.bandbar i { position: absolute; top: -3px; bottom: -3px; width: 3px; left: calc(var(--v) * 1% - 1px); background: var(--ink); border-radius: 1px; }
.bandbar.out i { background: var(--lose); }
.tier { font: 600 var(--s-1)/1 var(--f-data); padding: .2rem .4rem; border-radius: 3px; background: var(--paper); border: 1px solid var(--rule); }

/* Matrix */
.mx { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); overflow: auto; max-height: 82vh; }
table.grid { border-collapse: separate; border-spacing: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
table.grid th, table.grid td { padding: 0; }
table.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--sheet); height: 132px; vertical-align: bottom; border-bottom: 1px solid var(--rule); }
table.grid thead th .cl { writing-mode: vertical-rl; transform: rotate(180deg); font: 500 var(--s-1)/1 var(--f-body); color: var(--ink-2); padding: 6px 0; white-space: nowrap; cursor: pointer; margin: 0 auto; }
table.grid thead th.corner { left: 0; z-index: 4; }
table.grid tbody th { position: sticky; left: 0; z-index: 2; background: var(--sheet); text-align: right; padding: 0 .6rem; font: 500 var(--s-1)/1 var(--f-body); color: var(--ink-2); white-space: nowrap; border-right: 1px solid var(--rule); cursor: pointer; }
table.grid td.c { width: 34px; min-width: 34px; height: 28px; text-align: center; font-size: 11px; font-weight: 500; cursor: pointer; position: relative; border: 1px solid var(--sheet); }
table.grid td.c:hover, table.grid td.c.sel { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
table.grid td.c.dim { opacity: .28; }
table.grid td.c.self { background: var(--paper); color: var(--ink-3); cursor: default; }
table.grid td.c .d { position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
table.grid td.c.ob { box-shadow: inset 0 0 0 2px var(--ink); }
table.grid td.sum { position: sticky; right: 0; background: var(--sheet); padding: 0 .6rem; font-size: 12px; font-weight: 600; border-left: 1px solid var(--rule); text-align: right; }
table.grid th.hl .cl, table.grid tbody th.hl { color: var(--accent); }

/* Drawer */
.drawer { position: fixed; z-index: 20; background: var(--sheet); box-shadow: var(--shadow); border: 1px solid var(--rule); overflow-y: auto; transition: transform .22s ease; }
@media (min-width: 900px) { .drawer { top: 0; right: 0; bottom: 0; width: min(440px, 92vw); transform: translateX(105%); padding-top: env(safe-area-inset-top, 0px); } .drawer.open { transform: none; } }
@media (max-width: 899px) { .drawer { left: 0; right: 0; bottom: 0; max-height: 78vh; border-radius: 12px 12px 0 0; transform: translateY(105%); padding-bottom: env(safe-area-inset-bottom, 0px); } .drawer.open { transform: none; } }
.dh { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 1rem; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.dh button { font: inherit; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 4px; padding: .3rem .6rem; cursor: pointer; }
.db { padding: 1rem; display: grid; gap: 1rem; }
.db h2 { font-size: var(--s-5); }
.big { font: 600 2.4rem/1 var(--f-data); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
.stat { border: 1px solid var(--rule); border-radius: 4px; padding: .5rem .6rem; background: var(--paper); }
.stat .v { font: 600 var(--s-4)/1.2 var(--f-data); }
.pills { display: flex; flex-wrap: wrap; gap: .3rem; }
.pill { font: 500 var(--s-1)/1.4 var(--f-data); padding: .1rem .45rem; border-radius: 3px; background: var(--paper); border: 1px solid var(--rule); }
.pill.dmg { border-color: color-mix(in srgb, var(--lose) 45%, transparent); }
.mu { display: grid; grid-template-columns: minmax(0, 1fr) 90px 3.2rem; gap: .5rem; align-items: center; padding: .2rem 0; cursor: pointer; font-size: var(--s-1); }
.mu:hover { color: var(--accent); }
.mu .t { height: 7px; background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.mu .t b { display: block; height: 100%; }
.note { color: var(--ink-2); font-size: var(--s-2); margin: 0; }
.sb { font: 500 var(--s-1)/1.5 var(--f-data); color: var(--ink-2); margin: 0; padding-left: 1rem; }
footer { color: var(--ink-3); font-size: var(--s-1); display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; }
</style>
</head>

    <h1>Modern Metagame Matrix</h1>

        <span class="mk band"></span><span>outside its calibration band</span></div>

  <section class="standings" aria-labelledby="st-h">

  <section aria-label="Win-rate matrix">

  <footer id="foot"></footer>
</div>

  <div class="dh"><span class="label" id="dkind">Detail</span><button type="button" id="close">Close</button></div>
  <div class="db" id="dbody"></div>
</aside>

<script>
const S = JSON.parse(document.getElementById('site-data').textContent);
const D = S.decks, N = D.length;
let mode = 'weighted', sortBy = 'weighted', archF = '', selDeck = null, selCell = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = v => (v == null ? '–' : v.toFixed(0));
const wrOf = i => mode === 'weighted' ? D[i].weighted_wr : D[i].flat_wr;
const css = getComputedStyle(document.documentElement);
function heat(v) {
  const p = k => css.getPropertyValue(k).trim().split(/\s+/).map(parseFloat);
  const lo = p('--heat-lo'), mid = p('--heat-mid'), hi = p('--heat-hi');
  const [a, b, t] = v <= 50 ? [lo, mid, v / 50] : [mid, hi, (v - 50) / 50];
  const mix = a.map((x, k) => x + (b[k] - x) * t);
  return `hsl(${mix[0]} ${mix[1]}% ${mix[2]}%)`;
}
function inkOn(v) { return (v < 22 || v > 78) ? 'var(--heat-ink-light)' : 'var(--heat-ink-dark)'; }

const archs = [...new Set(D.map(d => d.archetype))].sort();
const archSel = document.getElementById('arch');
archs.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a[0].toUpperCase() + a.slice(1); archSel.appendChild(o); });

function order() {
  const idx = [...D.keys()].filter(i => !archF || D[i].archetype === archF);
  const key = {weighted: i => -D[i].weighted_wr, flat: i => -D[i].flat_wr, share: i => -D[i].meta_share, name: i => D[i].name}[sortBy];
  return idx.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
}

function renderHead() {
  const P = S.prov, C = S.cal;
  document.getElementById('lede').textContent =
    `${N} registered decks, every pairing played ${P.n_per_pair} times as best-of-three with sideboards — ${P.total_matches.toLocaleString()} matches. ` +
    `${C.decks_in_band} of ${C.decks_total} decks sit inside their calibration band. Select a deck or a cell for the card-level detail.`;
  const chips = [['Run', P.generated.slice(0, 10)], ['Commit', P.commit || '—'], ['Matches / pair', P.n_per_pair],
    ['Seeds', `${P.seed_start} + ${P.seed_step}·k`], ['Draws', P.draws], ['Aborted', P.aborted],
    ['Rule violations', P.rules_audit_violations == null ? 'not audited' : P.rules_audit_violations]];
  document.getElementById('prov').innerHTML = chips.map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join('');
  document.getElementById('foot').innerHTML =
    `<span>Generated by tools/meta_site from data/meta_site.json</span><span>${esc(P.command)}</span>` +
    `<span><a href="https://djpieter81.github.io/MTGSimManu/templates/reference_showcase.html">Project showcase</a></span>`;
}

function renderStandings(rows) {
  document.getElementById('st').innerHTML = rows.map((i, r) => {
    const d = D[i], v = d.flat_wr, out = d.band_verdict !== 'in';
    return `<tr data-i="${i}" class="${selDeck === i ? 'sel' : ''}">
      <td class="n">${r + 1}</td>
      <td><div class="deckname">${esc(d.name)}</div><div class="arch">${esc(d.archetype)}</div></td>
      <td><span class="tier">${esc(d.tier)}</span></td>
      <td class="n">${d.meta_share.toFixed(1)}</td>
      <td class="n">${d.flat_wr.toFixed(1)}</td>
      <td class="n">${d.weighted_wr.toFixed(1)}</td>
      <td><div style="display:flex;gap:.5rem;align-items:center"><div class="bandbar ${out ? 'out' : ''}" style="--lo:${d.band[0]};--hi:${d.band[1]};--v:${Math.max(0, Math.min(100, v))}" title="Expected ${d.band[0]}–${d.band[1]}% flat"><i></i></div>
        <span class="chip verdict-${d.band_verdict}">${d.band_verdict === 'in' ? 'in band' : d.band_verdict}</span></div></td>
      <td>${esc(d.best)}</td><td>${esc(d.worst)}</td></tr>`;
  }).join('');
  document.querySelectorAll('#st tr').forEach(tr => tr.onclick = () => showDeck(+tr.dataset.i));
}

function renderGrid(rows) {
  let h = '<thead><tr><th class="corner"></th>' + rows.map(j =>
    `<th class="${selDeck === j ? 'hl' : ''}"><div class="cl" data-i="${j}">${esc(D[j].name)}</div></th>`).join('') +
    `<th style="position:sticky;top:0;right:0;z-index:4;background:var(--sheet)"><div class="label" style="padding:0 .6rem 6px">${mode}</div></th></tr></thead><tbody>`;
  rows.forEach(i => {
    h += `<tr><th data-i="${i}" class="${selDeck === i ? 'hl' : ''}">${esc(D[i].name)}</th>`;
    rows.forEach(j => {
      if (i === j) { h += '<td class="c self">·</td>'; return; }
      const v = S.m[i][j], dr = S.dr[i][j], ab = S.ab[i][j], bv = S.bv[i][j];
      const dim = selDeck !== null && selDeck !== i && selDeck !== j;
      const sel = selCell && selCell[0] === i && selCell[1] === j;
      const t = `${D[i].name} ${pct(v)}% vs ${D[j].name}` + (dr ? `, ${dr} drawn` : '') + (ab ? `, ${ab} aborted` : '') + (bv && bv !== 'in' ? ' — outside its band' : '');
      h += `<td class="c${dim ? ' dim' : ''}${sel ? ' sel' : ''}${bv && bv !== 'in' ? ' ob' : ''}" data-i="${i}" data-j="${j}" style="background:${heat(v)};color:${inkOn(v)}" title="${esc(t)}">${pct(v)}${dr || ab ? '<span class="d"></span>' : ''}</td>`;
    });
    h += `<td class="sum">${wrOf(i).toFixed(1)}</td></tr>`;
  });
  const g = document.getElementById('grid'); g.innerHTML = h + '</tbody>';
  g.querySelectorAll('td.c[data-j]').forEach(td => td.onclick = () => showCell(+td.dataset.i, +td.dataset.j));
  g.querySelectorAll('[data-i]:not(td)').forEach(el => el.onclick = () => showDeck(+el.dataset.i));
}

function render() { const rows = order(); renderStandings(rows); renderGrid(rows); }

const dr = document.getElementById('drawer');
function open(kind, html) { document.getElementById('dkind').textContent = kind; document.getElementById('dbody').innerHTML = html; dr.classList.add('open'); }
function close() { dr.classList.remove('open'); selDeck = null; selCell = null; render(); }
document.getElementById('close').onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

const pills = (xs, cls = '') => (xs && xs.length) ? `<div class="pills">${xs.map(x => `<span class="pill ${cls}">${esc(x.card)} ×${x.count}</span>`).join('')}</div>` : '';

function showDeck(i) {
  selDeck = i; selCell = null; render();
  const d = D[i], det = d.detail || {};
  const opps = [...D.keys()].filter(j => j !== i).sort((a, b) => S.m[i][b] - S.m[i][a]);
  let h = `<div><h2>${esc(d.name)}</h2><div class="arch">${esc(d.archetype)} · ${d.meta_share.toFixed(1)}% of the field · ${esc(d.tier)}</div></div>
  <div class="stats"><div class="stat"><div class="label">Flat</div><div class="v">${d.flat_wr.toFixed(1)}%</div></div>
  <div class="stat"><div class="label">Weighted</div><div class="v">${d.weighted_wr.toFixed(1)}%</div></div>
  <div class="stat" style="grid-column:1/-1"><div class="label">Calibration band (flat)</div><div class="v">${d.band[0]}–${d.band[1]}% <span class="chip verdict-${d.band_verdict}">${d.band_verdict === 'in' ? 'in band' : d.band_verdict}</span></div><p class="note">${esc(d.band_provenance)}</p></div></div>`;
  if (det.summary) h += `<p class="note">${esc(det.summary)}</p>`;
  if (det.mvp_casts && det.mvp_casts.length) h += `<div><div class="label">Most cast</div>${pills(det.mvp_casts)}</div>`;
  if (det.mvp_damage && det.mvp_damage.length) h += `<div><div class="label">Most damage</div>${pills(det.mvp_damage, 'dmg')}</div>`;
  if (det.finishers && det.finishers.length) h += `<div><div class="label">How it wins</div>${det.finishers.map(f => `<p class="note"><b class="mono">${f.count}</b> ${esc(f.card)}${f.desc ? ' — ' + esc(f.desc) : ''}</p>`).join('')}</div>`;
  h += `<div><div class="label">Every matchup</div>${opps.map(j => {
    const v = S.m[i][j]; return `<div class="mu" data-j="${j}"><span>${esc(D[j].name)}</span><span class="t"><b style="width:${v}%;background:${heat(v)}"></b></span><span class="num" style="text-align:right">${pct(v)}%</span></div>`; }).join('')}</div>`;
  open('Deck', h);
  document.querySelectorAll('#dbody .mu').forEach(el => el.onclick = () => showCell(i, +el.dataset.j));
}

function showCell(i, j) {
  selCell = [i, j]; selDeck = null; render();
  const a = D[i], b = D[j], v = S.m[i][j], rv = S.m[j][i], p = S.mu[`${i},${j}`];
  let h = `<div><h2>${esc(a.name)} <span class="arch">vs</span> ${esc(b.name)}</h2><div class="arch">${S.prov.n_per_pair} best-of-three matches</div></div>
  <div class="big" style="color:${v >= 50 ? 'var(--win)' : 'var(--lose)'}">${pct(v)}%</div>
  <div class="stats"><div class="stat"><div class="label">${esc(b.name)} wins</div><div class="v">${pct(rv)}%</div></div>
  <div class="stat"><div class="label">Drawn · aborted</div><div class="v">${S.dr[i][j]} · ${S.ab[i][j]}</div></div>`;
  if (S.bands[i][j]) h += `<div class="stat" style="grid-column:1/-1"><div class="label">Calibration band</div><div class="v">${S.bands[i][j][0]}–${S.bands[i][j][1]}% <span class="chip verdict-${S.bv[i][j]}">${S.bv[i][j] === 'in' ? 'in band' : S.bv[i][j]}</span></div></div>`;
  h += '</div>';
  if (p) {
    if (p.insight) h += `<p class="note">${esc(p.insight)}</p>`;
    h += `<div class="stats">${p.avg_turns != null ? `<div class="stat"><div class="label">Average turns</div><div class="v">${p.avg_turns}</div></div>` : ''}
      ${p.went_to_3 != null ? `<div class="stat"><div class="label">Went to game 3</div><div class="v">${p.went_to_3}%</div></div>` : ''}
      ${p.g1_wr != null ? `<div class="stat"><div class="label">Game 1 win rate</div><div class="v">${p.g1_wr}%</div></div>` : ''}
      <div class="stat"><div class="label">Comebacks</div><div class="v">${p.comebacks[0]}–${p.comebacks[1]}</div></div></div>`;
    if (p.top_casts.length) h += `<div><div class="label">${esc(a.name)} key cards</div>${pills(p.top_casts)}${pills(p.top_damage, 'dmg')}</div>`;
    if (p.opp_top_casts.length) h += `<div><div class="label">${esc(b.name)} key cards</div>${pills(p.opp_top_casts)}${pills(p.opp_top_damage, 'dmg')}</div>`;
    if (p.sideboard.length || p.opp_sideboard.length) h += `<div><div class="label">Sideboarding seen in games</div><p class="note">${esc(a.name)}</p><ul class="sb">${p.sideboard.map(l => `<li>${esc(l)}</li>`).join('') || '<li>no changes</li>'}</ul><p class="note">${esc(b.name)}</p><ul class="sb">${p.opp_sideboard.map(l => `<li>${esc(l)}</li>`).join('') || '<li>no changes</li>'}</ul></div>`;
  } else {
    h += `<p class="note">No card-level detail was recorded for this pairing in the latest verbose run.</p>`;
  }
  open('Matchup', h);
}

document.getElementById('sort').onchange = e => { sortBy = e.target.value; render(); };
archSel.onchange = e => { archF = e.target.value; render(); };
for (const m of ['weighted', 'flat']) document.getElementById('w-' + m).onclick = () => {
  mode = m; document.getElementById('w-weighted').setAttribute('aria-pressed', m === 'weighted');
  document.getElementById('w-flat').setAttribute('aria-pressed', m === 'flat'); render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
renderHead(); render();
</script>
</body>
</html>
