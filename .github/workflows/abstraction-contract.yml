name: Abstraction Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # ai/llm_decision_scorer.py makes live agent.run_sync() calls
      # with no timeout when this is unset. CI has pydantic-ai-slim
      # installed (so agent construction succeeds) but no API key
      # (so the call hangs on DNS/socket until kernel timeout —
      # observed as 1h30m+ wall-time stalls). Offline mode uses the
      # DEFAULT_WEIGHTS table, which the module docstring guarantees
      # matches the pre-refactor constants exactly. Dedicated LLM
      # tests that exercise the live path live in test_llm_*.py and
      # are not in the curated CI subset.
      MTG_LLM_DECISION_SCORER_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pydantic-ai-slim covers everything CI needs: Agent,
        # TestModel, UsageLimits. The meta package `pydantic-ai`
        # pulls in every provider SDK (anthropic/openai/google/
        # bedrock/...) plus fastmcp/temporal/logfire — hundreds of
        # packages causing multi-minute (sometimes hanging) resolver
        # work on ubuntu-latest. Slim resolves to ~19 packages.
        #
        # pytest-timeout is the defense-in-depth: any single test
        # exceeding 60s fails by name rather than letting the job
        # silently consume the 6h GitHub Actions wall budget. The
        # primary defense against the decision-scorer hang is the
        # MTG_LLM_DECISION_SCORER_OFFLINE env at the top of this job.
        run: pip install pytest pytest-timeout pydantic-ai-slim requests beautifulsoup4

      - name: Run abstraction ratchet
        run: python tools/check_abstraction.py

      - name: Magic-number ratchet
        run: python tools/check_magic_numbers.py

      - name: Zone-mutation ratchet
        run: python tools/check_zone_mutation.py

      - name: Run doc hygiene check
        run: python tools/check_doc_hygiene.py

      - name: Oracle-runtime-parse ratchet
        run: python tools/check_oracle_runtime_parse.py

      - name: Card-name-registry ratchet
        run: python tools/check_card_name_registry.py

      - name: Gameplan/decklist consistency gate
        # Every card a decks/gameplans/*.json names must be in that deck's
        # MODERN_DECKS mainboard or sideboard. Decklist refreshes used to
        # leave gameplans naming cut cards, which silently misdirected the
        # mulligan keystone protection and gameplan weighting.
        run: python tools/check_gameplan_consistency.py

      - name: Assemble card DB
        # ModernAtomic.json is gitignored, so a fresh checkout doesn't have
        # it. The classifier gate below constructs CardDatabase() directly
        # (no pytest sidecar), so assemble the canonical DB from the
        # committed parts first — otherwise auto-discovery falls through to
        # the 48-card ModernAtomic_mini.json walkthrough fixture and the
        # gate checks a near-empty pool via the loader's one-shot
        # auto-merge fallback instead of this explicit, visible step.
        run: python3 merge_db.py

      - name: Classifier coverage gate (tag-gated engine behavior)
        run: python tools/check_classifier_coverage.py

      - name: Loyalty-dispatch ratchet (needs the assembled card DB)
        run: python tools/check_loyalty_dispatch.py

      - name: Run abstraction-contract pytest
        run: python -m pytest tests/test_abstraction_contract.py tests/test_check_abstraction_deck_gates.py tests/test_doc_hygiene.py tests/test_magic_numbers_ratchet.py tests/test_check_magic_numbers.py tests/test_zone_mutation_ratchet.py tests/test_oracle_runtime_parse_ratchet.py tests/test_gameplan_consistency.py --timeout=60 -q

      - name: Run full test suite
        # The full suite now runs in CI. It became feasible once the
        # CardDatabase load was consolidated onto a single process-wide
        # shared instance (tests/_card_db_cache.py + the session-scoped
        # conftest fixture); previously each of ~280 test modules
        # reloaded the 21k-card DB (~7s each → ~80 min), which is why a
        # curated 14-file subset ran here instead. Wall time is now a
        # couple of minutes.
        #
        # ModernAtomic.json is gitignored, so it is absent in a fresh
        # checkout; conftest reassembles a sidecar from the committed
        # ModernAtomic_part*.json and routes CardDatabase to it, so the
        # suite has real card data without a separate setup step.
        #
        # Deselected — one remaining known-failure, tracked for a
        # dedicated follow-up PR:
        #   - test_etb_graveyard_return.py: the generic ETB "return
        #     target card from your graveyard to your hand" resolver is
        #     unimplemented. Adding it needs a new oracle-classifier
        #     tag, whose cache is built by an LLM-backed tool
        #     (tools/build_oracle_classifier_cache.py) — not
        #     reproducible in offline CI.
        #
        # The suite is hash-independent (verified green under multiple
        # PYTHONHASHSEED values), so no hash pin is needed.
        # test_llm_embeddings.py is auto-skipped (numpy not installed);
        # see the optional-dependency collect_ignore in conftest.py.
        #
        # Split into two sequential chunks (2026-08-29). The single-process
        # run stopped completing on the runner: two consecutive jobs failed a
        # test at 26% and were then killed by "The runner has received a
        # shutdown signal" BEFORE pytest printed its summary, so the failing
        # test's NAME was never reported and could not be diagnosed. The same
        # single-process run is also OOM-killed locally (~4.7 GB RSS), which
        # is why every agent already runs this suite in chunks by hand.
        #
        # Chunking bounds per-process memory and, critically, makes each chunk
        # print its own summary — a truncation can no longer hide which test
        # failed. Coverage is IDENTICAL: the same three deselects, and the
        # guard step below fails the job if the two globs ever stop covering
        # every collected test file (a silently-skipped file would be worse
        # than the problem this solves).
        run: |
          python - <<'GUARD'
          import glob, pathlib, sys
          all_files = {p for p in glob.glob("tests/test_*.py")}
          chunk1 = set(glob.glob("tests/test_[a-g]*.py"))
          chunk2 = set(glob.glob("tests/test_[h-z]*.py"))
          missed = all_files - chunk1 - chunk2
          overlap = chunk1 & chunk2
          if missed or overlap:
              print(f"chunk globs do not partition tests/: missed={sorted(missed)} overlap={sorted(overlap)}")
              sys.exit(1)
          print(f"chunk coverage OK: {len(chunk1)} + {len(chunk2)} = {len(all_files)} files")
          GUARD
          # --ignore-glob (not an explicit file list): conftest.py's
          # collect_ignore for optional deps — test_llm_embeddings.py when
          # numpy is absent — only applies to DIRECTORY collection. Naming
          # files explicitly bypasses it and turns a clean auto-skip into a
          # collection ERROR, which is exactly what the first attempt did.
          python -m pytest tests/ -q --timeout=120 --tb=short \
            --ignore-glob='tests/test_[h-z]*.py' \
            --deselect tests/test_etb_graveyard_return.py \
            --deselect tests/test_card_features.py::test_extraction_performance
          python -m pytest tests/ -q --timeout=120 --tb=short \
            --ignore-glob='tests/test_[a-g]*.py' --ignore=tests/eval \
            --deselect tests/test_parallel_matrix.py
