name: Weekly Refresh

# Runs entirely on GitHub-hosted infra — no local machine or login needed.
# - schedule: full pipeline every Monday 06:00 UTC (decklists + matrix + dashboard)
# - workflow_dispatch: manual trigger, used by the two control panel buttons
#     mode=full             -> same as the schedule
#     mode=decklists_only   -> tier-1 decklist fetch + diff report only (fast)
#
# Step ordering is load-bearing (see 2026-11-07 fix): the decklist fetch is
# cheap (~60s) and its output is the data the registry is refreshed from, so it
# commits and pushes on its own, BEFORE the hours-long matrix step. Previously
# a single terminal commit step sat downstream of the matrix; the matrix grew
# past the 6h GitHub job ceiling, the runner was hard-killed, the commit step
# was skipped, and 13 consecutive weeks of successful fetches (2026-08-17 ..
# 2026-11-02) were discarded without ever surfacing an error. Keep the
# decklist commit ahead of the matrix, and keep the matrix bounded by
# timeout-minutes so it fails visibly instead of consuming the job budget.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full (decklists + matrix + dashboard) or decklists_only'
        required: true
        default: 'full'
        type: choice
        options: [full, decklists_only]

jobs:
  weekly:
    runs-on: ubuntu-latest
    # Below GitHub's hard 6h ceiling, so the job ends on our terms and the
    # terminal steps still run instead of the runner being killed mid-step.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reassemble ModernAtomic.json
        run: |
          python3 -c "
          import json
          merged = {}
          for i in range(1, 9):
              try:
                  with open(f'ModernAtomic_part{i}.json') as f:
                      merged.update(json.load(f)['data'])
              except FileNotFoundError:
                  break
          with open('ModernAtomic.json', 'w') as f:
              json.dump({'meta': {}, 'data': merged}, f)
          print(f'Loaded {len(merged)} cards')
          "

      - name: Fetch tier-1 decklists + diff report
        run: |
          python3 tools/fetch_tier1_decklists.py --top 16 --events-per-archetype 2

      # Commits the fetch output immediately, so a later matrix failure or
      # timeout can never discard it. Scoped to the decklist tree only — the
      # matrix artifacts are committed by the terminal step once they exist.
      - name: Commit and push tier-1 decklists
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A data/tier1_decklists
          if git diff --cached --quiet; then
            echo "No decklist changes to commit."
          else
            git commit -m "data: weekly tier-1 decklist fetch (${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}) via GitHub Actions"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Full matrix refresh (top 16 decks, n=50)
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        # Bounded so an overrunning matrix fails this step cleanly and leaves
        # the remaining steps (commit, upload) their own time to run.
        timeout-minutes: 240
        run: |
          python3 run_meta.py --matrix --decks 16 -n 50 --save --workers 3
          python3 merge_matrix_results.py
          python3 build_dashboard.py metagame_data.jsx modern_meta_matrix_full.html
          python3 build_guide.py --all guides/
          python3 scan_results.py --js
          python3 build_showcase.py mtgsimmanu_showcase.html

      # always(): a timed-out or failed matrix must not strand whatever it did
      # finish, and must not skip the upload below.
      - name: Commit and push matrix results
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No matrix results to commit."
          else
            git commit -m "data: weekly matrix refresh (${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}) via GitHub Actions"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-results
          path: |
            data/tier1_decklists/**
            metagame_results.json
            modern_meta_matrix_full.html
            run_history.json
          retention-days: 30
